name: Changelog Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  changelog-gate:
    name: Changelog gate
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, 'CHANGELOG-CHECKED') ||
      startsWith(github.event.changes.body.from, 'CHANGELOG-CHECKED')))
    runs-on: ubuntu-latest
    # Job-level so that ignored comments, whose job is skipped, never cancel a running gate.
    concurrency:
      group: changelog-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      # Scripts come from the base commit (the default branch on issue_comment), never from the PR head:
      # a PR must not be able to rewrite the approval rules that judge it.
      - name: Checkout scripts from base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Changelog check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.ORG_GITHUB_TOKEN }}
          script: |
            const scripts = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;
            const { findDependencyMajors, formatMajorsMarkdown } = await import(`${scripts}/dependency-majors.mjs`);
            const { evaluateApproval } = await import(`${scripts}/changelog-approval.mjs`);

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            const headSha = pr.head.sha;
            const baseSha = pr.base.sha;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const readPackageJson = async (ref) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: 'package.json', ref });
              return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
            };
            const [basePkg, headPkg] = await Promise.all([readPackageJson(baseSha), readPackageJson(headSha)]);
            const majors = findDependencyMajors(basePkg, headPkg);

            const setStatus = (state, description) =>
              github.rest.repos.createCommitStatus({
                owner, repo, sha: headSha, state, context: 'Changelog check', description, target_url: runUrl,
              });

            if (majors.length === 0) {
              await setStatus('success', 'No dependency major');
              return;
            }

            const checkLabel = { name: 'changelog-check', color: 'FBCA04', description: 'Dependency major: changelogs to read' };
            try {
              await github.rest.issues.createLabel({ owner, repo, ...checkLabel });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [checkLabel.name] });

            const getRole = async (login) => {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
                return data.role_name;
              } catch (error) {
                if (error.status === 404) return 'none';
                throw error;
              }
            };
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const { approved, approver, rejected } = await evaluateApproval(comments, getRole);
            for (const { login, reason } of rejected) {
              core.info(`Ignored CHANGELOG-CHECKED from ${login}: ${reason}`);
            }

            const marker = '<!-- changelog-gate -->';
            const table = formatMajorsMarkdown(majors);
            const body = approved
              ? `${marker}\n✅ **Changelog check**\n\nDependency majors in this PR:\n\n${table}\n\nChangelogs confirmed by @${approver}.`
              : `${marker}\n⏳ **Changelog check**\n\nThis PR bumps dependency majors:\n\n${table}\n\nRead the changelog of each package, then reply with a comment whose first line is exactly \`CHANGELOG-CHECKED\`. Only a non-bot user with write, maintain or admin permission on this repository counts.`;

            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

            if (approved) {
              await setStatus('success', `Changelogs confirmed by ${approver}`);
              return;
            }
            await setStatus('failure', `Waiting for CHANGELOG-CHECKED (${majors.length} dependency major${majors.length > 1 ? 's' : ''})`);
            core.setFailed('Dependency majors without an eligible CHANGELOG-CHECKED comment');
